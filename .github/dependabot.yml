version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "being24"
    cooldown:
      default-days: 3
      semver-patch-days: 1
    groups:
      uv-all:
        applies-to: version-updates
        patterns:
          - "*"
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
